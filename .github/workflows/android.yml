name: Android Debug APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (data validation and JS tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate project and data files
        run: node scripts/validate.js

      - name: Run JS tests (search, filters, validation, i18n)
        run: node scripts/test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle wrapper if it is not committed
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing -> generating wrapper (Gradle 8.7)"
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew

      - name: Kotlin unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bustime-bd-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Runs only when a version tag (v1.0.0 ...) is pushed: attaches the APK to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK built above
        uses: actions/download-artifact@v4
        with:
          name: bustime-bd-debug-apk
          path: apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cp apk/*.apk BusTime-BD.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BusTime-BD.apk --clobber
          else
            gh release create "$TAG" BusTime-BD.apk \
              --title "BusTime BD $TAG" \
              --notes "BusTime BD $TAG. Debug-signed APK: Android may ask you to allow installs from this source."
          fi
